features:
  - key: worktree-orchestration-cli
    title: zazzles Worktree Orchestration CLI
    status: proposed
    file: worktree-orchestration-cli.md
    domain: cli, git, worktrees, pr orchestration, agent workflows
    current_milestone: M0 proposed
    current_state: >
      No implementation is live yet. The feature has been defined from the proposal
      as the foundational zazzles CLI surface for local DAG state, worktree lifecycle,
      PR management, propagation, agent-friendly automation, and managed stack naming.
    purpose: >
      Defines the long-lived zazzles CLI capability for operating worktree graphs,
      parent-relative PR workflows, automated downstream propagation, and `.zazz`-backed stack coordination on one machine.
  - key: zazzles-app-and-ui
    title: zazzles App and UI
    status: proposed
    file: zazzles-app-and-ui.md
    domain: app, ui, graph review, diff, conflict workflows
    current_milestone: M0 proposed
    current_state: >
      No installable app implementation is live yet. The feature is defined as the
      future visual application surface built on the shared zazzles core and CLI state.
    purpose: >
      Defines the long-lived zazzles application and UI capability for graph-native review,
      visual worktree operations, and future local-only-file maintenance flows.
