[workspace]
members = [
    "apps/cli",
    "crates/core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
assert_cmd = "2.1.1"
clap = { version = "4.5.38", features = ["derive"] }
predicates = "3.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "0.9.5"
